<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui/vendor/prism.css">
  <link rel="stylesheet" href="/ui/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='1' y='3' width='14' height='11' fill='%234453d6'/%3E%3Crect x='4' y='6' width='3' height='3' fill='%23fff'/%3E%3Crect x='9' y='6' width='3' height='3' fill='%23fff'/%3E%3Crect x='5' y='11' width='6' height='1' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="3" width="14" height="11" fill="currentColor"/><rect x="4" y="6" width="3" height="3" fill="#fff"/><rect x="9" y="6" width="3" height="3" fill="#fff"/><rect x="5" y="11" width="6" height="1" fill="#fff"/><rect x="7" y="0" width="2" height="3" fill="currentColor"/></svg>
      <span class="brand-name">Agent Office</span>
    </div>

    <div class="menu" id="ws-menu">
      <button class="menu-btn" id="ws-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="ws-pop">
        <i data-icon="folder"></i><span class="menu-text"><small>Workspace</small><b id="ws-name">Chưa có</b></span><i data-icon="chevron" class="chev"></i>
      </button>
      <div class="menu-pop" id="ws-pop" hidden></div>
    </div>

    <div class="menu" id="run-menu">
      <button class="menu-btn" id="run-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="run-pop">
        <i data-icon="history"></i><span class="menu-text"><small>Lần chạy</small><b id="run-name">Trực tiếp</b></span><i data-icon="chevron" class="chev"></i>
      </button>
      <div class="menu-pop wide" id="run-pop" hidden></div>
    </div>

    <div class="spacer"></div>
    <span id="conn" class="conn" role="status" hidden>Mất kết nối, đang thử lại…</span>
    <button id="stop-run" class="btn danger-soft" type="button" hidden><i data-icon="stop"></i>Dừng lần chạy</button>
    <button id="open-office" class="btn" type="button"><i data-icon="layout"></i><span class="btn-text">Văn phòng</span></button>
    <button id="open-store" class="btn" type="button"><i data-icon="store"></i><span class="btn-text">Kho role</span></button>
    <button id="open-settings" class="icon-btn" type="button" aria-label="Cài đặt" title="Cài đặt"><i data-icon="gear"></i></button>
  </header>

  <section class="now" aria-label="Tình hình hiện tại">
    <div id="now-body" class="now-body"></div>
    <div id="replay-controls" class="replay" hidden>
      <button id="replay-toggle" class="icon-btn" type="button" aria-label="Tạm dừng"><i data-icon="pause"></i></button>
      <div class="seg" role="group" aria-label="Tốc độ phát lại">
        <button type="button" data-speed="1">x1</button>
        <button type="button" data-speed="4" class="on">x4</button>
        <button type="button" data-speed="16">x16</button>
        <button type="button" data-speed="0" title="Tới cuối ngay">Cuối</button>
      </div>
      <div class="progress" aria-hidden="true"><span id="replay-bar"></span></div>
      <button id="go-live" class="btn small" type="button">Về trực tiếp</button>
    </div>
  </section>

  <main class="ide-layout" id="ide-layout">
    <!-- 1. Activity Bar (48px) -->
    <nav class="activity-bar" id="activity-bar" aria-label="Thanh tác vụ">
      <div class="act-group top">
        <button id="act-explorer" class="act-btn on" type="button" title="Explorer (Ctrl+B)" aria-label="Explorer"><i data-icon="sidebar"></i></button>
        <button id="act-changes" class="act-btn" type="button" title="Thay đổi theo lần chạy" aria-label="Thay đổi"><i data-icon="git"></i></button>
        <button id="act-panel" class="act-btn on" type="button" title="Bảng điều khiển (Ctrl+J)" aria-label="Bảng điều khiển"><i data-icon="panel"></i></button>
        <button id="act-feed" class="act-btn on" type="button" title="Hoạt động gần đây" aria-label="Hoạt động gần đây"><i data-icon="history"></i></button>
        <button id="act-chat" class="act-btn on" type="button" title="Trò chuyện Manager (Ctrl+Alt+B)" aria-label="Trò chuyện"><i data-icon="chat"></i></button>
      </div>
      <div class="spacer"></div>
      <div class="act-group bottom">
        <button id="act-store" class="act-btn" type="button" title="Kho role" aria-label="Kho role"><i data-icon="store"></i></button>
        <button id="act-settings" class="act-btn" type="button" title="Cài đặt" aria-label="Cài đặt"><i data-icon="gear"></i></button>
        <button id="act-theme" class="act-btn" type="button" title="Giao diện Sáng / Tối" aria-label="Giao diện"><i data-icon="sun"></i></button>
      </div>
    </nav>

    <!-- 2. Sidebar Explorer (240px, resizable) -->
    <aside class="sidebar-explorer" id="sidebar-explorer" aria-label="Cây thư mục Workspace">
      <div class="sidebar-header">
        <span class="sidebar-title" id="explorer-title">EXPLORER</span>
        <div class="sidebar-actions">
          <button id="explorer-create-file" class="icon-btn small" type="button" title="Tạo tệp mới" aria-label="Tạo tệp mới"><i data-icon="plus"></i></button>
          <button id="explorer-refresh" class="icon-btn small" type="button" title="Làm mới cây thư mục" aria-label="Làm mới"><i data-icon="refresh"></i></button>
        </div>
      </div>
      <div class="explorer-tree" id="explorer-tree"></div>
    </aside>

    <!-- 2b. Sidebar Changes (240px, run-based diff) -->
    <aside class="sidebar-explorer sidebar-changes" id="sidebar-changes" aria-label="Thay đổi theo lần chạy" hidden>
      <div class="sidebar-header">
        <span class="sidebar-title">THAY ĐỔI</span>
        <div class="sidebar-actions">
          <button id="changes-refresh" class="icon-btn small" type="button" title="Làm mới thay đổi" aria-label="Làm mới"><i data-icon="refresh"></i></button>
        </div>
      </div>
      <div class="changes-controls">
        <label class="changes-run-label" for="changes-run-select">Lần chạy:</label>
        <select id="changes-run-select" class="changes-run-select"></select>
        <div class="changes-notice">ℹ️ Chỉ theo dõi file đội sửa bằng công cụ write/edit</div>
      </div>
      <div class="changes-file-list" id="changes-file-list"></div>
    </aside>

    <!-- 3. Central Area (Editor tabs + Office / Code view + Bottom panel) -->
    <section class="main-editor-area" id="main-editor-area">
      <div class="editor-tabs-bar" role="tablist" id="editor-tabs" aria-label="Thẻ soạn thảo"></div>

      <div class="editor-content-area" id="editor-content-area">
        <!-- Pinned Office View -->
        <div class="view-office" id="view-office">
          <div class="stage" id="stage">
            <div id="office" class="office" aria-label="Văn phòng — bấm vào nhân viên để xem chi tiết"></div>
            <div id="onboard" class="onboard" hidden></div>
            <div id="approvals" class="approvals" aria-live="assertive"></div>
            <button id="feed-restore-btn" class="feed-restore-btn" type="button" title="Hiện hoạt động gần đây" hidden><i data-icon="history"></i><span>Hoạt động</span></button>
          </div>
          <section class="feed-card" id="feed-card" aria-labelledby="feed-title">
            <header class="card-head">
              <h2 id="feed-title">Hoạt động gần đây</h2>
              <ul class="legend" aria-label="Chú thích trạng thái">
                <li><i class="dot lg-working"></i>Đang làm</li>
                <li><i class="dot lg-waiting"></i>Chờ role khác</li>
                <li><i class="dot lg-approval"></i>Chờ bạn duyệt</li>
                <li><i class="dot lg-idle"></i>Rảnh</li>
              </ul>
              <button id="feed-close" class="icon-btn small feed-close-btn" type="button" title="Thu gọn hoạt động gần đây" aria-label="Thu gọn"><i data-icon="x"></i></button>
            </header>
            <ol id="feed" class="feed"></ol>
          </section>
        </div>

        <!-- Read-only Code Viewer -->
        <div class="view-editor" id="view-editor" hidden></div>
      </div>

      <!-- Bottom Panel (Flow & Log with Question Selectors) -->
      <div class="bottom-panel" id="bottom-panel">
        <div class="bottom-panel-resizer" id="bottom-panel-resizer" title="Kéo để chỉnh độ cao"></div>
        <div class="bottom-panel-header">
          <nav class="bottom-tabs" role="tablist" aria-label="Bảng bên dưới">
            <button role="tab" id="bottom-tab-flow" data-bottom-tab="flow" class="bottom-tab on" aria-selected="true"><i data-icon="flow"></i>Luồng việc <span id="flow-count" class="count"></span></button>
            <button role="tab" id="bottom-tab-log" data-bottom-tab="log" class="bottom-tab" aria-selected="false"><i data-icon="log"></i>Nhật ký <span id="log-count" class="count"></span></button>
            <button role="tab" id="bottom-tab-commands" data-bottom-tab="commands" class="bottom-tab" aria-selected="false"><i data-icon="terminal"></i>Lệnh <span id="commands-count" class="count"></span></button>
            <button role="tab" id="bottom-tab-tests" data-bottom-tab="tests" class="bottom-tab" aria-selected="false"><i data-icon="checkCircle"></i>Kết quả test <span id="tests-badge" class="badge"></span></button>
          </nav>
          <div class="bottom-panel-actions">
            <button id="bottom-panel-close" class="icon-btn small" type="button" title="Thu gọn bảng (Ctrl+J)" aria-label="Thu gọn"><i data-icon="x"></i></button>
          </div>
        </div>

        <div class="bottom-panel-content">
          <div class="bottom-tab-panel" id="panel-flow" data-panel="flow">
            <div class="panel-toolbar">
              <label class="question-bar"><span>Câu hỏi:</span><select id="flow-question" class="select question-select" aria-label="Chọn câu hỏi trong Luồng việc"></select></label>
            </div>
            <div id="flow" class="flow"></div>
          </div>

          <div class="bottom-tab-panel" id="panel-log" data-panel="log" hidden>
            <div class="panel-toolbar">
              <label class="question-bar"><span>Câu hỏi:</span><select id="log-question" class="select question-select" aria-label="Chọn câu hỏi trong Nhật ký"></select></label>
            </div>
            <div class="log-filters">
              <div class="chips" id="log-type" role="group" aria-label="Lọc theo loại">
                <button type="button" data-v="" class="on">Tất cả</button>
                <button type="button" data-v="task">Việc</button>
                <button type="button" data-v="message">Tin nhắn</button>
                <button type="button" data-v="tool">Công cụ</button>
                <button type="button" data-v="approval">Duyệt</button>
                <button type="button" data-v="error">Lỗi</button>
              </div>
              <select id="log-role" class="select" aria-label="Lọc theo role"><option value="">Mọi người</option></select>
            </div>
            <div id="log" class="log"></div>
          </div>

          <div class="bottom-tab-panel" id="panel-commands" data-panel="commands" hidden>
            <div class="panel-toolbar">
              <label class="question-bar"><span>Câu hỏi:</span><select id="commands-question" class="select question-select" aria-label="Chọn câu hỏi trong Nhật ký lệnh"></select></label>
              <div class="commands-filters">
                <select id="commands-role" class="select" aria-label="Lọc theo role"><option value="">Mọi người</option></select>
              </div>
            </div>
            <div id="commands-list" class="commands-list"></div>
          </div>

          <div class="bottom-tab-panel" id="panel-tests" data-panel="tests" hidden>
            <div class="panel-toolbar">
              <label class="question-bar"><span>Câu hỏi:</span><select id="tests-question" class="select question-select" aria-label="Chọn câu hỏi trong Kết quả test"></select></label>
            </div>
            <div id="tests-content" class="tests-content"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 4. Side Chat Manager (340px) -->
    <aside class="side-chat" id="side-chat" aria-label="Trò chuyện với Manager">
      <div class="side-chat-resizer" id="side-chat-resizer" title="Kéo để đổi độ rộng · nhấp đúp để về mặc định"></div>
      <div class="side-chat-header">
        <span class="side-chat-title"><i data-icon="chat"></i>Trò chuyện Manager</span>
        <button id="side-chat-float" class="icon-btn small" type="button" title="Tách ra cửa sổ nổi" aria-label="Tách ra cửa sổ nổi"><i data-icon="popout"></i></button>
        <button id="side-chat-close" class="icon-btn small" type="button" title="Ẩn khung chat (Ctrl+Alt+B)" aria-label="Ẩn"><i data-icon="x"></i></button>
      </div>
      <div id="queue-banner" class="queue-banner" hidden></div>
      <div id="chat" class="chat" aria-live="polite"></div>
      <form id="chat-form" class="composer">
        <textarea id="chat-input" rows="1" placeholder="Nhắn cho Manager…" aria-label="Tin nhắn cho Manager"></textarea>
        <button class="send" type="submit" aria-label="Gửi"><i data-icon="send"></i></button>
        <p class="composer-hint">Enter để gửi · Shift+Enter xuống dòng</p>
      </form>
    </aside>
  </main>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-card" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <button class="drawer-close icon-btn" type="button" aria-label="Đóng"><i data-icon="x"></i></button>
      <div id="drawer-body"></div>
    </div>
  </div>

  <dialog id="ask" class="ask"></dialog>
  <dialog id="command-modal" class="ask modal-dialog" aria-label="Toàn bộ output của lệnh"></dialog>
  <dialog id="setup" class="ask sheet setup" aria-label="Kết nối model AI"></dialog>
  <dialog id="settings" class="ask sheet"></dialog>
  <dialog id="store" class="ask sheet wide"></dialog>
  <dialog id="office-dialog" class="ask sheet wide"></dialog>
  <dialog id="conflict-dialog" class="ask sheet wide" aria-label="Xung đột tệp"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="/ui/js/app.js"></script>
</body>
</html>
